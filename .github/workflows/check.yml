# SPDX-License-Identifier: MIT
name: Check skill
on: [push, pull_request]
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate_package.py
      - run: python scripts/build_release.py
      - run: python -m zipfile -e dist/toon-character-workflow.zip dist/extracted
      - run: python scripts/validate_package.py dist/extracted/toon-character-workflow
